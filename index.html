<!doctype html>
<html lang="en">
<head>

<body>
  <canvas id="hydra-bg" aria-hidden="true"></canvas>
  <div class="bg-overlay" aria-hidden="true"></div>

  <header class="site-header">
    <nav class="nav">
      <div role="heading" aria-level="1">
        <a class="brand" href="./">Hi, I'm Lance</a>
      </div>
      <div class="nav-right">
        <div class="display-controls">
          <button id="content-toggle" class="content-toggle" type="button" aria-pressed="false">
            gaze
          </button>
          <label class="opacity-control">
            <span>opacity</span>
            <input
              type="range"
              id="overlay-opacity"
              min="0"
              max="90"
              step="1"
              value="55"
              aria-label="Background overlay transparency"
            />
          </label>
          <label class="opacity-control">
            <span>morph</span>
            <input
              type="range"
              id="morph-speed"
              min="0"
              max="100"
              step="1"
              value="91"
              aria-label="Animation clock speed"
            />
          </label>

          <span class="eyes-emoji" aria-hidden="true">👀</span>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="section landing">
      <div class="hero-photo-wrap">
        <img class="hero-photo" src="assets/profile.jpg" alt="Lance Simmons" width="200" height="200" />
      </div>

      <p class="landing-intro">I'm currently seeking new professional opportunities with the right team. Please get in touch:</p>

      <div class="landing-links">
        <a href="mailto:lancehowardsimmons@gmail.com">
          <img class="link-icon" src="assets/email_blue.png" alt="email lancehowardsimmons@gmail.com" />
        </a>
        <a href="https://github.com/lancehsimmons" target="_blank" rel="noopener">
          <img class="link-icon" src="assets/github_blue.png" alt="Github" />
        </a>
      </div>

      <nav class="landing-nav" aria-label="Choose a version of this site">
        <a class="contact-link" href="engnr/">Software engineering →</a>
        <a class="contact-link" href="sprt/">Technical support engineering →</a>
      </nav>
    </section>
  </main>

  <footer class="site-footer">
    <p>Animation created with <a href="https://hydra.ojack.xyz/" target="_blank" rel="noopener">Hydra</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hydra-synth/dist/hydra-synth.js"></script>
  <script src="script-custom.js"></script>
  <script src="ui-controls.js"></script>
</body>
</html>
